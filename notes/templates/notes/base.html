{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>If This Was You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Maplibre GL CSS -->
    <link
    href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    rel="stylesheet"
    />
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/7bf12df681.js" crossorigin="anonymous"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'notes/css/styles.css' %}" />
  </head>
  <body>
    <!-- Header & Navigation -->
    <header class="site-header">
       <nav>
      <a href="{% url 'notes:home' %}" class="logo">If That Was You</a>
        <a href="{% url 'notes:home' %}">Map</a>
        <a href="{% url 'notes:submit' %}">Leave a note</a>
      </nav>
    </header>
    <!-- Main Content -->
    <main>{% block content %} {% endblock %}</main>

    <!-- Maplibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

    {% block extra_js %} {% endblock %}

</html>
