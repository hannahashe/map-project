{% extends "notes/base.html" %} {% load static %} {% block content %}


<div class="filter-bar" aria-label="Filter notes by category">
  <button type="button" class="active" data-category="all">All</button>
  <button type="button" data-category="gratitude">Gratitude</button>
  <button type="button" data-category="recognition">Recognition</button>
  <button type="button" data-category="almost_friend">Almost friends</button>
  <button type="button" data-category="hope_okay">Hope you're okay</button>
  <button type="button" data-category="door_open">Door left open</button>
</div>

<button id="random-note-button" class="ghost-button" type="button">
  Show me something kind
</button>

<section class="map-shell">
  <div id="map"></div>

  <div class="map-title-overlay">
    <p class="eyebrow">Interactive memory map</p>
    <h1>If This Was You</h1>
    <p>
      A soft map of fleeting connection, unsent gratitude,
      almost-friendship, and moments of recognition.
    </p>
    <a href="{% url 'notes:submit' %}" class="button">Leave a note</a>
  </div>
</section>

{% endblock %}
{% block extra_js %}
<script>
  window.MAPTILER_KEY = "{{ maptiler_key|escapejs }}";
</script>
<script src="{% static 'notes/js/map.js' %}"></script>
{% endblock %}
